<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Souls by Zamani</title>
  <meta name="description" content="Get in touch with Souls by Zamani: orders, sizing, bespoke requests and wholesale.">
  <meta property="og:title" content="Contact | Souls by Zamani">
  <meta property="og:description" content="Get in touch with Souls by Zamani: orders, sizing, bespoke requests and wholesale.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#1e1611">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-head">
      <div class="container">
        <span class="eyebrow">We'd love to hear from you</span>
        <h1>Contact us</h1>
        <p>Questions about sizing, an order, a bespoke idea or wholesale? Send a message. We reply within one working day.</p>
      </div>
    </section>
    <div class="container contact-grid">
      <aside class="contact-card" id="contact-card"></aside>
      <div>
        <form id="contact-form" class="fields" novalidate>
          <div class="field"><label for="c-name">Name</label><input id="c-name" name="Name" required></div>
          <div class="field"><label for="c-email">Email</label><input id="c-email" name="Email" type="email" required></div>
          <div class="field"><label for="c-phone">Phone (optional)</label><input id="c-phone" name="Phone" type="tel"></div>
          <div class="field"><label for="c-topic">Topic</label>
            <select id="c-topic" name="Topic"><option>General question</option><option>My order</option><option>Sizing &amp; fit</option><option>Returns &amp; exchanges</option><option>Bespoke request</option><option>Wholesale &amp; stockists</option><option>Press</option></select>
          </div>
          <div class="field field--full"><label for="c-order">Order number (if any)</label><input id="c-order" name="Order" placeholder="SBZ…"></div>
          <div class="field field--full"><label for="c-msg">Message</label><textarea id="c-msg" name="Message" required></textarea></div>
          <div class="field--full" style="display:flex;gap:12px;flex-wrap:wrap">
            <button class="btn btn--dark" type="submit" data-via="email">Send message</button>
            <button class="btn btn--wa" type="submit" data-via="whatsapp">Send on WhatsApp</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
