name: Fetch images

on:
  push:
    paths: ["tools/fetch/jobs.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch/fetch.py
      - name: Hand results back on a temporary branch
        run: |
          cd out
          git init -q -b asset-cache
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Fetched images"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" asset-cache:claude/souls-asset-cache
